name: Deploy Giut Server (Dev)

on:
  push:
    branches:
      - dev

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-giut-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate dev deployment variables
        run: |
          : "${AWS_REGION:?Set the dev environment variable AWS_REGION}"
          : "${ECR_REPOSITORY:?Set the dev environment variable ECR_REPOSITORY}"
          : "${EC2_INSTANCE_ID:?Set the dev environment variable EC2_INSTANCE_ID}"
          : "${AWS_ROLE_ARN:?Set the dev environment variable AWS_ROLE_ARN}"
          [[ "$AWS_REGION" =~ ^[a-z]{2}-[a-z]+-[0-9]+$ ]]
          [[ "$ECR_REPOSITORY" =~ ^[a-z0-9._/-]+$ ]]
          [[ "$EC2_INSTANCE_ID" =~ ^i-[0-9a-f]+$ ]]

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build application
        run: ./gradlew clean bootJar -x test

      - name: Prepare Docker JAR
        run: |
          JAR_FILE=$(find build/libs -maxdepth 1 -name 'giut-server-*.jar' ! -name '*-plain.jar' | head -n 1)
          test -n "$JAR_FILE"
          cp "$JAR_FILE" deploy-dev.jar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker buildx build --platform linux/amd64,linux/arm64 \
            -f Dockerfile.dev -t "$IMAGE_URI" --push .

      - name: Deploy to Dev EC2 via SSM
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          ENCODED_SCRIPT=$(base64 < .github/scripts/deploy-dev-ec2.sh | tr -d '\n')
          REMOTE_COMMAND="printf '%s' '$ENCODED_SCRIPT' | base64 --decode | bash -s -- '$AWS_REGION' '$IMAGE_URI'"
          PARAMETERS=$(jq -nc --arg command "$REMOTE_COMMAND" '{commands:[$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy Giut dev $IMAGE_TAG" \
            --parameters "$PARAMETERS" \
            --query Command.CommandId \
            --output text)

          for attempt in {1..90}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
          test "$STATUS" = Success
