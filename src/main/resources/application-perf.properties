app.performance.seed.enabled=${PERF_SEED_ENABLED:false}
app.performance.seed.confirmation=${PERF_SEED_CONFIRMATION:}
app.performance.seed.measurement-password=${PERF_SEED_PASSWORD:}

app.performance.seed.team-count=${PERF_TEAM_COUNT:1000}
app.performance.seed.team-members-per-team=${PERF_TEAM_MEMBERS_PER_TEAM:5}
app.performance.seed.applications-per-team=${PERF_APPLICATIONS_PER_TEAM:20}
app.performance.seed.chat-room-count=${PERF_CHAT_ROOM_COUNT:100}
app.performance.seed.messages-per-room=${PERF_MESSAGES_PER_ROOM:1000}
app.performance.seed.batch-size=${PERF_SEED_BATCH_SIZE:500}

spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
spring.jpa.properties.hibernate.jdbc.batch_size=${PERF_SEED_BATCH_SIZE:500}
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# SQL 개수 측정 시에만 Hibernate Statistics를 활성화합니다.
app.performance.sql-counter.enabled=${PERF_SQL_COUNTER_ENABLED:false}
spring.jpa.properties.hibernate.generate_statistics=${PERF_SQL_COUNTER_ENABLED:false}
logging.level.org.hibernate.stat=OFF
