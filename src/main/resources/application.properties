spring.application.name=giut-server

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration-time=${JWT_EXPIRATION_TIME:86400000}
jwt.refresh-expiration-time=${JWT_REFRESH_EXPIRATION_TIME:604800000}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

kakao.rest-api-key=${KAKAO_REST_API_KEY:}
kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8080/api/oauth/kakao/callback}
kakao.client-secret=${KAKAO_CLIENT_SECRET:}

apple.client-id=${APPLE_CLIENT_ID:}
apple.redirect-uri=${APPLE_REDIRECT_URI:}
apple.team-id=${APPLE_TEAM_ID:}
apple.key-id=${APPLE_KEY_ID:}
apple.private-key-path=${APPLE_PRIVATE_KEY_PATH:}

app.oauth.success-redirect-uri=${APP_OAUTH_SUCCESS_REDIRECT_URI:http://localhost:3000/oauth/callback}
app.oauth.cookie-secure=${APP_OAUTH_COOKIE_SECURE:false}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

spring.flyway.enabled=false

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.properties.hibernate.highlight_sql=true
