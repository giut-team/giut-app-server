server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name api.dev.giut.store;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://api.dev.giut.store$request_uri;
    }
}

# A request for the production domain must not reach the development app.
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 443 ssl;
    server_name api.dev.giut.store;

    ssl_certificate /etc/letsencrypt/live/api.dev.giut.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dev.giut.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:GiutDevTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/giut-proxy.conf;
}
